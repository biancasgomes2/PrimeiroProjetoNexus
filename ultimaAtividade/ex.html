<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-do List</title>
    <link rel="stylesheet" href="ex.css">
</head>
<body>

    <div class="container">
        <h1>To-do List</h1>

        <div class="input-area">
            <input type="text" id="campoTarefa" placeholder="Adicionar uma nova tarefa...">
            <button id="botao">Adicionar</button>

            <ul id="tarefas">
                <li>
                    <span>Olá mundo</span>
                    <button class="delete-btn">✕</button>
                </li>

                <li>
                    <span>Tarefa 2</span>
                    <button class="delete-btn">✕</button>
                </li>
            </ul>

        </div>

    </div>

    <script src="ex.js"></script>
</body>
</html>
