<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de CEP</title>
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="atvd.css">
</head>
<body>
    <div class="container">
        <h1>Consulta de CEP</h1>
        <p>Digite um CEP e veja o endereço completo, usando a AP do ViaCEP.</p>
        <div class="espacoCep"> 
            <input type="text" class="form-control" id="cepInput" placeholder="Ex: 01310930">
            <button type="button" id="botao" class="btn btn-primary">Buscar</button>
        </div>
        <div id="resultado" class="card p-3 border-0 shadow-sm bg-white d-none">
            <h5 id="rua" class="fw-bold text-secondary mb-2"></h5>
            <p><strong>Bairro:</strong><span id="bairro"></span></p>
            <p><strong>Cidade/UF:</strong><span id="cidadeUF"></span></p>
            <p><strong>CEP:</strong><span id="cepExibido"></span></p>
        </div>
    </div>
    <script src="atvd.js"></script>
</body>
</html>
